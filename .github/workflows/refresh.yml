name: Refrescar Reporte BUPA

on:
  schedule:
    # Cada 5 minutos. GitHub recomienda no bajar de 5 minutos; en momentos
    # de alta carga la ejecucion puede demorarse un poco mas de lo programado.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    # En GitHub Enterprise Server "on-premise" normalmente NO hay runners
    # hospedados por GitHub: se necesita un runner self-hosted registrado
    # por el administrador (Settings -> Actions -> Runners). Si tu instancia
    # sí tiene runners hospedados habilitados, puedes cambiar esto a
    # "ubuntu-latest".
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refrescar datos y regenerar index.html
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python scripts/refresh_report.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se hace commit."
          else
            git commit -m "chore: refrescar datos del reporte BUPA"
            git push
          fi
